server:
  port: 8080

spring:
  application:
    name: eagle-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/eagle?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: eagle
    password: eagle

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

eagle:
  zk:
    address: 127.0.0.1:2181,127.0.0.1:2182,127.0.0.1:2183
    root: /config
    auth-enable: false

logging:
  level:
    com.eagle.admin: info
